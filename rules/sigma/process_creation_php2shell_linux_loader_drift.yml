logsource:
    category: process_creation
    product: linux
detection:
    sel_php_parent:
        ParentImage|re: '(?i)(libphp|php-fpm|/php(fpm)?$|apache2)'
    sel_shell_children:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/python'
            - '/perl'
            - '/nc'
            - '/ncat'
            - '/curl'
            - '/wget'
    sel_nfs_loader:
        CommandLine|endswith: './nfs php'
    sel_loader_fetch:
        CommandLine|contains:
            - 'http://92.118.112.100/nfs'
            - 'http://92.118.112.100/nfs-setup'
    sel_roulette_renames:
        CommandLine|contains:
            - 'telnetd'
            - 'udhcpc'
            - 'upnpd'
            - 'watchdog'
            - 'syslogd'
            - 'klogd'
            - 'uhttpd'
            - 'uchttpd'
    condition: sel_nfs_loader or sel_loader_fetch or (sel_php_parent and sel_shell_children)
falsepositives:
    - 'Admin tooling and legit shell users may match the sel_php_parent + sel_shell_children pair if a php process legitimately spawns curl/wget (CI, package updates); triage with the /tmp/nfs and ./nfs php variants first (near-zero false positives)'
    - 'Watchdog/syslogd renames are selected via CommandLine content and can hit unrelated admin activity that MENTIONS those names — prefer ELLIO/Potassium context'
level: high