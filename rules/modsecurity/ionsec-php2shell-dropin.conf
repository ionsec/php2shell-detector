# =============================================================================
# IONSEC php2shell detector — ModSecurity drop-in for CRS environments
# CVE-2026-109618 (RCE via OOM corruption) / CVE-2026-109619 (RCE via stale global state)
# Compiled: 2026-10-23 · Author: IONSEC · File: ionsec-php2shell-dropin.conf
# ==============================================================================
#
# DOCUMENTED GAP THIS FILE FILLS:
#   As of 2026-10-23 the OWASP ModSecurity Core Rule Set (CRS 3.x/4.x) has NO
#   PHP2Shell-specific rules — verification trail: php2shell.eu's detection
#   matrix records "CRS: --" (no rule) checked 2026-10-23 (fetched:
#   archive /Users/ruji/.hermes/cache/scratch/php2shell/pages/php2shell_eu.txt),
#   and no 202610918/109619/109618-numbered rule or php2shell-named rule exists
#   in the CRS rules tree. CRS-adjacent rules (920320/920340 multipart-URL-enc,
#   920420 request body size, 921xxx protocol/HTTP parser rules) cover
#   generic multipart hygiene only and do not fingerprint these CVEs.
#   This is a SHIPPED drop-in config complementing CRS, not a CRS commit.
#
# RULE-ID CONVENTION (private, community-following):
#   IDs 1026109601-1026109610 live in the community-established 1026xxxx
#   custom-convention block for this exact bug pair — php2shell.eu /
#   pasqualepillitteri.it published an example community rule for this CVE
#   pair with id:1026109618 (ARGS_NAMES @streq PHP_SESSION_UPLOAD_PROGRESS).
#   That example is NOT copied here; our numbering 1026109601-... avoids
#   collision with CRS's 900000-999999 space and ModSecurity builtin ranges.
#
# ENFORCEMENT MODE: detection-only (pass,log) — flip to blocking per-rule after
#   a tuning period by replacing ",pass,log" with ",deny,status:403,log" in the
#   rules you trust. Guidance: deny is safe ONLY where you have disabled
#   session.upload_progress.enabled (php.ini/pool level, then restart every
#   worker — Wiz/php.net/Sansec mitigation guidance) or where upload-progress
#   is genuinely unused; the bare field also occurs in legitimate
#   upload-progress-bar traffic ("signal, not a verdict" — ELLIO).
#
# COVERAGE MATRIX (what each rule covers; CVE mapping in each rule's tag/msg):
#   1026109601  self-naming php2shell UA family                          both CVEs
#   1026109602  multipart + PHP_SESSION_UPLOAD_PROGRESS form field       109619 (+109618 tooling)
#   1026109603  raw-body fallback for the same field (name-token)        109619 (+109618 tooling)
#   1026109604  published PoC boundary strings (header + body)           both CVEs
#   1026109605  hardcoded session IDs / canary progress values           both CVEs
#   1026109606  weaponized execution canaries in request body            both CVEs
#   1026109607  deep-nested field names (advisory amplification shape)   109618
#   1026109608  unbounded part-header flood (advisory amplification)     109618
#   1026109609  response-body execution canaries (compromise signal)     both CVEs
#   1026109610  oversized/malformed PHPSESSID response cookie (heuristic)  109618
#   Known coverage gap (documented, not papered over): EMPTY FILE CONTROLS
#   (advisory amplification vector) cannot be counted reliably with ModSec
#   variables — left to the Suricata/Zeek rules (Corelight-style body
#   inspection) and to upstream CRS parser-rule work.
#
# REQUIREMENTS + CAVEATS (read before shipping):
#   - SecRequestBodyAccess On is REQUIRED for body rules; CRS recommended
#     config enables it. Body rules see only up to SecRequestBodyLimit /
#     REQBODY processing limits — oversized attempts may be truncated or
#     aborted by CRS rules 920420/920280 before these fire (a block by 920
#     rules IS mitigation; log correlation applies).
#   - "One of the two vulnerabilities is largely outside the reach of any web
#     application firewall" (AWS Security Blog) — a WAF is a mitigation layer;
#     patching (8.2.35/8.3.36/8.4.27/8.5.12) + worker restart remains the fix.
#   - Header-amplification within one part can stay under body-size caps
#     (AWS WAF limitation, same as theirs) — 1026109608 addresses the
#     aggregate part-header count.
#   - Fingerprints below are copied EXACTLY as published by the cited,
#     fetched sources (ELLIO / F5 / VulnCheck / Arctic Wolf / Sophos); no
#     invented fingerprints. Tuning thresholds are parameters, labelled where
#     they are ours.
# ==============================================================================

# --- 1026109601 — self-naming tooling UA family --------------------------------
# Covers every UA whose string contains "php2shell"/"PHP2Shell" (matches the
# published families: ELLIO indicators "user agents php2shell-scan/109618,
# php2shell-109618, php2shell-verify/1.0"; F5 appendix (~100 entries incl.
# "php2shell-scan/1.3 (eigen-oppervlak controle; CVE-2026-109618/109619)",
# "php2shell-poc/1.0 (authorized-staging-test; marker=cryptographer-php-poc-here)",
# "PHP2Shell-VulnCheck/2.0 (responsible-disclosure)", ...); VulnCheck Canary;
# Flare "php2shell-109618 / php2shell-109619"). F5 caveat applies: many
# attackers blend in with legit UAs.
SecRule REQUEST_HEADERS:User-Agent "@contains php2shell" \
    "id:1026109601,phase:1,pass,log,auditlog,t:none,t:lowercase,severity:'CRITICAL',\
    msg:'php2shell self-identifying tooling user-agent (CVE-2026-109618/CVE-2026-109619)',\
    logdata:'%{MATCHED_VAR}',\
    tag:'cve-2026-109618',tag:'cve-2026-109619',tag:'php2shell',tag:'ionsec-php2shell-detector'"

# --- 1026109602 — multipart POST carrying PHP_SESSION_UPLOAD_PROGRESS ----------
# Field name is PHP's own (session.upload_progress, ON by default). Wiz advisory:
# upload-progress path works "even if the app never calls session_start()".
# ELLIO telemetry basis: 33 addresses / 743 requests carrying the field by
# 23:00 UTC 21 Oct; F5: ~98% of observed events on the 109619 path.
# Detection-only because legit upload-progress bars use the same field.
SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
    "id:1026109602,phase:2,pass,log,auditlog,t:none,t:lowercase,chain,severity:'WARNING',\
    msg:'multipart request carrying PHP_SESSION_UPLOAD_PROGRESS form field (CVE-2026-109619 path; also present in 109618-labelled tooling)',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'cve-2026-109619',tag:'cve-2026-109618',tag:'php2shell',tag:'ionsec-php2shell-detector'"
    SecRule ARGS_POST_NAMES|ARGS_NAMES "@streq php_session_upload_progress" "t:none,t:lowercase"

# --- 1026109603 — raw-body fallback for the same field name token --------------
# For deployments where the parser does not expose the name as an ARGS name
# (partial parsing, parser aborts) — same intent as 1026109602, keyed on the
# wire form of the field name. Requires SecRequestBodyAccess On.
SecRule REQUEST_BODY "@rx (?i)name=.?php_session_upload_progress" \
    "id:1026109603,phase:2,pass,log,auditlog,t:none,severity:'WARNING',\
    msg:'raw multipart body references PHP_SESSION_UPLOAD_PROGRESS (parser fallback)(CVE-2026-109619 path)',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'cve-2026-109619',tag:'php2shell',tag:'ionsec-php2shell-detector'"

# --- 1026109604 — published PoC boundary strings --------------------------------
# EXACT strings as published: "B7kQpoc618" (F5 Pattern 3 / Sophos IOC table /
# ELLIO), "B7kQpoc619" (Flare/KELA), "php2shelld656557dacfa4fbc" (F5 Pattern 1
# exact Content-Type boundary=----php2shelld656557dacfa4fbc), "----p2shell"
# (ELLIO indicators: boundary strings beginning ----p2s, including ----p2shell),
# "--nucleiBoundary" and "------atk" (ELLIO 22 Oct sensor captures).
# Checked in the Content-Type header (phase 1) OR raw body (phase 2 chain).
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)boundary=[ \t]*[-]{2,8}(b7kqpoc(618|619)|p2shell|php2shelld656557dacfa4fbc|nucleiBoundary|atk|p2s[0-9a-f]{8})" \
    "id:1026109604,phase:1,pass,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'published php2shell PoC multipart boundary (CVE-2026-109618/CVE-2026-109619)',\
    logdata:'%{MATCHED_VAR}',\
    tag:'cve-2026-109618',tag:'cve-2026-109619',tag:'php2shell',tag:'ionsec-php2shell-detector'"

# --- 1026109605 — hardcoded session IDs / canary progress values ---------------
# EXACT values as published: Cookie/PHPSESSID "a1b2c3d4e5f6a7b8c9d0e1f2a3"
# (F5 Pattern 3, "a static PoC artifact"); "xqsuvwz3n97wu8j3emz1axuo5y" (VulnCheck
# PHPSESSID value / session filename sess_xqsuvwz3n97wu8j3emz1axuo5y); progress
# canaries "p2sprobec982a06c" (F5 Pattern 1), "leaksessionid01", "P2SMARK",
# "P2SMK" (with random letters), "POC_79fe5e4f", "nuclei-probe" (ELLIO).
SecRule REQUEST_BODY "@rx (?i)(PHPSESSID=(a1b2c3d4e5f6a7b8c9d0e1f2a3|xqsuvwz3n97wu8j3emz1axuo5y|leaksessionid01)|p2sprobec982a06c|P2SMARK|P2SMK|POC_79fe5e4f|nuclei-probe|leaksessionid01)" \
    "id:1026109605,phase:2,pass,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'php2shell hardcoded session/progress artifact (CVE-2026-109618/CVE-2026-109619)',\
    logdata:'%{MATCHED_VAR}',\
    tag:'cve-2026-109618',tag:'cve-2026-109619',tag:'php2shell',tag:'ionsec-php2shell-detector'"

# --- 1026109606 — weaponized execution canaries in the request body ------------
# EXACT strings as published (ELLIO/VulnCheck/Arctic Wolf, fetched 2026-10-23):
# "uname -a; id; echo JACKALPOC" (public PoC default command; marker JACKALPOC =
# run unmodified); "system(base64_decode(" wrapping "echo PHP2SHELL_OK; id; whoami"
# (ELLIO 45.136.71.89); "<?php echo 'PWNED::'; system($_GET['c']); ?>" (VulnCheck
# webshell; "PWNED:: in any response means it ran"); "php2shell_out_start" /
# "php2shell_out_end" (F5 live-PHP UA echo pattern); "echo PHP2SHELL_CONFIRMED"
# (Arctic Wolf repeated in padded form fields).
SecRule REQUEST_BODY "@rx (?i)(uname -a; id; echo JACKALPOC|system\(base64_decode\(|echo PHP2SHELL_OK; id; whoami|PWNED::|php2shell_out_start|php2shell_out_end|echo PHP2SHELL_CONFIRMED)" \
    "id:1026109606,phase:2,pass,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'php2shell weaponized execution canary in request body (CVE-2026-109618/CVE-2026-109619 exploitation attempt)',\
    logdata:'%{MATCHED_VAR}',\
    tag:'cve-2026-109618',tag:'cve-2026-109619',tag:'attack.execution',tag:'ionsec-php2shell-detector'"

# --- 1026109607 — deep-nested field names (109618 amplification shape) ---------
# Advisory amplification vector "deeply nested field names"; published observed
# form: ELLIO 68,456-byte body with 1,000 parts, fields a0000[0] through
# a0997[0]; advisory wording "field names nested dozens of levels deep".
# TUNING: depth>=18; ELLIO observed bodies nest "dozens of levels".
SecRule ARGS_NAMES "@rx (?:[^[]*\[){18,}" \
    "id:1026109607,phase:2,pass,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'deeply nested multipart/form-data field names (CVE-2026-109618 amplification shape; ELLIO a0000[0]-style 1000-part bodies)',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'cve-2026-109618',tag:'php2shell',tag:'ionsec-php2shell-detector'"

# --- 1026109608 — unbounded part-header flood (109618 amplification shape) ----
# Advisory amplification vector "unbounded part headers". Published observed
# magnitudes (ELLIO): 'X:a' repeated 1,663,221 / 1,872,936 times inside 8,388,608
# / 9,437,183-byte bodies ("Every repeat is a line the parser reads as a part
# header"). TUNING: &MULTIPART_PART_HEADERS>=256 is OUR floor well below the
# observed flood and documented in the open-decisions notes; MULTIPART_PART_
# HEADERS is a documented ModSecurity v2.x+ collection (part headers of
# multipart bodies).
SecRule &MULTIPART_PART_HEADERS "@ge 256" \
    "id:1026109608,phase:2,pass,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'multipart part-header flood (CVE-2026-109618 amplification shape; header-per-part unbounded expansion)',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'cve-2026-109618',tag:'php2shell',tag:'ionsec-php2shell-detector'"

# --- 1026109609 — response-phase execution canaries (compromise signal) -------
# Same exact strings as 1026109606, observed in RESPONSES. VulnCheck: "PWNED::
# in any response means it ran"; ELLIO: marker JACKALPOC "means it was run
# unmodified". A hit here is a near-certain compromise signal — pivot to IR.
SecRule RESPONSE_BODY "@rx (?i)(PWNED::|JACKALPOC|php2shell_out_start|PHP2SHELL_OK)" \
    "id:1026109609,phase:3,pass,log,auditlog,t:none,severity:'EMERGENCY',\
    msg:'php2shell execution canary echoed in response (CVE-2026-109618/CVE-2026-109619 compromise signal)',\
    logdata:'%{MATCHED_VAR}',\
    tag:'cve-2026-109618',tag:'cve-2026-109619',tag:'attack.execution',tag:'ionsec-php2shell-detector'"

# --- 1026109610 — oversized/malformed PHPSESSID response cookie (heuristic) ----
# Wiz's disclosure canary for the 109618 memory-disclosure primitive: "a later
# multipart request URL-encodes reclaimed memory into the PHPSESSID response
# cookie" — their generic signal is "unexpectedly large or malformed PHPSESSID
# response cookies". TUNING: >=120 chars / >=20 %-runs is OUR threshold (normal
# session ids ~26-32 hex), documented as an open decision; not a fingerprint.
SecRule RESPONSE_HEADERS:Set-Cookie "@rx (?i)PHPSESSID=[0-9A-Za-z%._-]{120,}" \
    "id:1026109610,phase:3,pass,log,auditlog,t:none,severity:'CRITICAL',\
    msg:'oversized PHPSESSID response cookie after multipart traffic (CVE-2026-109618 memory-disclosure canary; Wiz-published signal, IONSEC threshold)',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'cve-2026-109618',tag:'php2shell',tag:'ionsec-php2shell-detector'"

